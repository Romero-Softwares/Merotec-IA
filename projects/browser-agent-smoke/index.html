<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste agente e navegador</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fb; color: #172033; }
    main { width: min(90vw, 480px); padding: 2rem; border-radius: 16px; background: white; box-shadow: 0 16px 40px #25375a22; }
    label, input, button { display: block; width: 100%; box-sizing: border-box; }
    input { margin: .5rem 0 1rem; padding: .7rem; border: 1px solid #a8b4ca; border-radius: 8px; }
    button { padding: .75rem; border: 0; border-radius: 8px; background: #175cd3; color: white; font-weight: 700; cursor: pointer; }
    #result { min-height: 1.5em; margin-top: 1rem; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <h1>Teste de comunicação</h1>
    <p>Projeto mínimo para validar uma interação completa pelo navegador.</p>
    <form id="confirmation-form">
      <label for="name">Seu nome</label>
      <input id="name" name="name" autocomplete="off" placeholder="Digite seu nome">
      <button id="confirm" type="submit">Confirmar</button>
    </form>
    <p id="result" role="status" aria-live="polite">Aguardando interação.</p>
  </main>
  <script>
    const nameInput = document.querySelector('#name');
    const result = document.querySelector('#result');
    document.querySelector('#confirmation-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      result.textContent = name ? `Comunicação concluída: olá, ${name}!` : 'Informe um nome para concluir o teste.';
    });
  </script>
</body>
</html>
